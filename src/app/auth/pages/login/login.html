<div class="min-h-screen w-full bg-[#0B132B] flex flex-col   p-4">

  <!-- Main Content -->
  <div class="main-container flex  flex-grow items-center justify-center p-4">

    <div class="box-login w-full max-w-3xl grid grid-cols-1 md:grid-cols-2 rounded-3xl 
           bg-white/10 bbackdrop-blur-2xl border border-white/30
           shadow-2xl relative overflow-hidden">


      <!-- Company Logo -->
      <div class="flex flex-col items-center justify-center p-10 bg-white/5">
        
       

        <div class="w-52 h-52 flex items-center justify-center rounded-full">
          <img src="images/logo_club_referidos.png" class="w-full h-full object-contain" alt="Logo" />
        </div>

        <h2 class="mt-6 text-white text-2xl font-semibold text-center leading-tight">
          Panel Administrativo <br /> Club de Referidos
        </h2>
      </div>


      <!-- Login Form -->
      <div class="p-10 flex flex-col justify-center text-white ">

        <h1 class="text-4xl font-bold mb-2">Ingreso</h1>
        <p class="text-2xl text-gray-300 mb-8">Accede a tu cuenta</p>

       
          <!-- Usuario -->
          <label class="text-gray-300 text-sm">Usuario</label>
          <input type="text" name="username" 
            class="w-full mt-1 mb-6 px-4 py-2 rounded-xl bg-white/10
                 border border-white/20 text-white outline-none
                 focus:border-blue-500 focus:ring-2 focus:ring-blue-400 transition-all"
            [value]="userName()" (input)="userName.set(txtUserName.value)" #txtUserName>
          <!-- Contraseña -->
          <label class="text-gray-300 text-sm">Contraseña</label>
          <input type="password" name="password" 
            class="w-full mt-1 mb-8 px-4 py-2 rounded-xl bg-white/10
                 border border-white/20 text-white outline-none
                 focus:border-blue-500 focus:ring-2 focus:ring-blue-400 transition-all"
            [value]="password()" (input)="password.set(txtPassword.value)"
            (keydown.enter)="login()"
            #txtPassword >
          @if(errorObj().isError) {
          <div class="text-red-600 text-sm text-center">
            {{ errorObj().message }}
          </div>
          }
          <!-- Botón Ingresar -->
          <button type="button"
            class="w-full py-3 rounded-xl bg-gradient-to-r from-blue-500 to-blue-600
                 hover:from-blue-400 hover:to-blue-500 transition-all
                 text-white font-semibold shadow-lg hover:shadow-blue-500/40"
            [disabled]="loading()" (click)="login()">
            @if (loading()) {
              <span class="inline-flex items-center gap-2">
                <svg class="animate-spin h-4 w-4 text-current" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" aria-hidden="true">
                  <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                  <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
                </svg>
                Ingresando...
              </span>
            } @else {
              Ingresar
            }
          </button>
        
      </div>
    </div>

  </div>

  <!-- Footer -->
  <footer class="text-center mt-10 mb-4">
    <span class="text-sm text-gray-500 sm:text-center dark:text-gray-400">
      © 2025
      <a [routerLink]="['/']" class="hover:underline">FUNDEA</a>. All Rights Reserved.
    </span>
  </footer>

</div>
