name: "CD - Despliegue Frontend Angular - FUNDEA Aliados (Develop)"

on:
  push:
    branches: [ "develop" ]
  workflow_dispatch:

permissions:
  contents: read

# Evita que dos despliegues escriban en el mismo directorio al mismo tiempo
concurrency:
  group: cd-develop-fundeaaliados
  cancel-in-progress: false

jobs:
  security-scan:
    name: "DevSecOps Security Scan"
    uses: ./.github/workflows/security-scan.yml
    permissions:
      contents: read

  build-and-deploy:
    name: "Build y Despliegue Frontend a Servidor Develop"
    # Solo despliega si pasan los 4 jobs del escaneo: build (con firmas npm), SAST, secrets y SCA
    needs: security-scan
    # La etiqueta personalizada 'development' asegura que el job corra solo en el runner 'desarrollotrans'.
    # Sin ella, el job también puede caer en 'Fundea_pro' (tiene las mismas etiquetas por defecto).
    runs-on: [self-hosted, Linux, X64, development]

    steps:
      - name: Checkout del Código Fuente
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Configurar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar Dependencias
        run: npm ci

      - name: Generar environment.ts con Secrets de GitHub
        run: |
          # angular.json no tiene fileReplacements: el build de producción usa environment.ts directamente
          cat <<EOF > src/environments/environment.ts
          export const environment = {
              production: true,
              path: '${{ secrets.FUNDEA_DEV_API_URL }}',
              apiPath: '${{ secrets.FUNDEA_DEV_API_URL }}${{ secrets.FUNDEA_DEV_PREFIX }}',
              tokenCheckInterval: 5,
              diasAtrasMovimientos: 1,
          };
          EOF

      - name: Ejecutar Build de Angular
        run: npx ng build --configuration production

      - name: Desplegar en el Directorio Web
        run: |
          # rsync reemplaza el 'rm -rf' + 'cp' de deploy:ubuntu, sin dejar el sitio vacío durante la copia
          mkdir -p /var/www/fundeaaliados/browser
          rsync -av --delete dist/fundeaaliados/browser/ /var/www/fundeaaliados/browser/
